name: 自动发布到 PyPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-yuhanboxl-to-pypi
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/yuhanboxl/

    steps:
      - name: 检出发布分支最新代码
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 同步排队期间产生的提交
        run: git pull --ff-only origin main

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装构建和检查工具
        run: python -m pip install --upgrade build twine

      - name: 获取 PyPI 当前版本并生成下一版本
        id: version
        shell: bash
        run: |
          CURRENT_VERSION="$(python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen(
              "https://pypi.org/pypi/yuhanboxl/json", timeout=30
          ) as response:
              package_data = json.load(response)
          print(package_data["info"]["version"])
          PY
          )"
          NEW_VERSION="$(python scripts/bump_version.py --base-version "$CURRENT_VERSION")"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "PyPI 当前版本：$CURRENT_VERSION；本次发布版本：$NEW_VERSION"

      - name: 运行项目测试
        run: python -m unittest discover -s tests -v

      - name: 编译检查 Python 源码
        run: python -m compileall -q scripts tests yuhanboxl

      - name: 构建并检查发行包
        run: |
          python -m build
          python -m twine check dist/*

      - name: 提交版本号并创建标签
        shell: bash
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- setup.py; then
            git add -- setup.py
            git commit -m "build: 发布版本 ${NEW_VERSION} [skip ci]"
          fi

          if ! git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            git tag -a "v${NEW_VERSION}" -m "发布版本 ${NEW_VERSION}"
          fi

          git push origin HEAD:main --follow-tags

      - name: 发布发行包到 PyPI
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
